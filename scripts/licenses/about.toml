# cargo-about configuration for THIRD-PARTY-NOTICES.md (see scripts/third-party-notices.ps1).
# Only permissive licenses are accepted. A dependency under any other license fails generation,
# so copyleft crates cannot slip in unnoticed.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = ["ring"]

# nom-exif ships a license-file instead of an SPDX field; its LICENSE is MIT.
[nom-exif.clarify]
license = "MIT"
[[nom-exif.clarify.files]]
path = "LICENSE"
checksum = "9cfbbedc535b1a4b73b2f7f51fd683ac6cae914f6d4bc7f271b9b230dd4e2808"
