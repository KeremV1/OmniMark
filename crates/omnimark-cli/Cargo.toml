[package]
name = "omnimark-cli"
description = "Command line front end for OmniMark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "omnimark"
path = "src/main.rs"

[features]
default = ["ocr-windows"]
ocr-windows = ["omnimark-core/ocr-windows"]

[dependencies]
omnimark-core = { path = "../omnimark-core", features = ["ocr"] }
clap.workspace = true


[dev-dependencies]
tempfile.workspace = true
