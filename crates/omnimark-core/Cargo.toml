[package]
name = "omnimark-core"
description = "OmniMark conversion core: documents to Markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# ocrs engine (pure Rust, downloaded models) and the model download code.
ocr = ["dep:ocrs", "dep:rten", "dep:ureq", "dep:dirs"]
# Windows.Media.Ocr engine; no effect on other platforms.
ocr-windows = ["dep:windows"]

[dependencies]
zip.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
serde.workspace = true
infer.workspace = true
chardetng.workspace = true
encoding_rs.workspace = true
calamine.workspace = true
htmd.workspace = true
pdfium-render.workspace = true
sha2.workspace = true
image.workspace = true
nom-exif.workspace = true
imagesize.workspace = true
ocrs = { workspace = true, optional = true }
rten = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
regex.workspace = true
ab_glyph.workspace = true
