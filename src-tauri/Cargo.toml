[package]
name = "omnimark-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "omnimark_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
omnimark-core = { path = "../crates/omnimark-core", features = ["ocr", "ocr-windows"] }
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-log = "2.10.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
