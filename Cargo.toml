[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
infer = "0.22.0"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
csv = "1.4.0"
htmd = "0.5.5"
calamine = { version = "0.36.1", features = ["chrono"] }
pdfium-render = "0.9.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
regex = "1.13.1"
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
