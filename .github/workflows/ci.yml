name: CI
on:
  push:
    branches: [main, m1, 'm1-*', m2, 'm2-*', 'm2/*']
    # Documentation-only pushes do not need a build (macOS minutes count 10x on private repos).
    paths-ignore: ['**.md', 'docs/**', '.claude/**', 'design/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.claude/**', 'design/**', 'LICENSE']
# A newer push to the same branch supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Fetch pdfium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-pdfium.ps1
      - name: Fetch pdfium (macOS/Linux)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-pdfium.sh
      - run: npm ci
      - run: npm run build
      - name: Cache ocrs models
        id: ocrs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ocr-models
          key: ocrs-models-a917b23d-86c145c2
      - name: Fetch ocrs models
        if: steps.ocrs-cache.outputs.cache-hit != 'true'
        run: cargo run -p omnimark-cli -- models fetch ocrs --models-dir "${{ runner.temp }}/ocr-models"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          OMNIMARK_OCR_MODELS: ${{ runner.temp }}/ocr-models
      - run: cargo test -p omnimark-core --features ocr,ocr-windows
        env:
          OMNIMARK_OCR_MODELS: ${{ runner.temp }}/ocr-models
      - run: cargo clippy -p omnimark-core --all-targets --features ocr,ocr-windows -- -D warnings
      - run: npm test
      - run: npm run typecheck
